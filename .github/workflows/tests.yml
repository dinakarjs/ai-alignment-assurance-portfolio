name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI
        run: |
          assurance-demo cloudguard examples/cloudguard_incident.json
          assurance-demo trace examples/agent_trace.json
          assurance-demo copilot examples/requirements.json
          assurance-demo benchmark
      - name: Exercise Agent Trace Assurance audit trail
        run: |
          assurance-trace-audit --audit-log /tmp/trace-audit.jsonl check-update examples/check_update.json
          assurance-trace-audit --audit-log /tmp/trace-audit.jsonl evaluate examples/agent_trace.json --check-version agent-trace-checks/5.0.0
          assurance-trace-audit --audit-log /tmp/trace-audit.jsonl verify
          test "$(wc -l < /tmp/trace-audit.jsonl)" -eq 2

  verilator-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and Verilator
        run: |
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Validate assertion with Verilator
        run: |
          python - <<'PY'
          from assurance_portfolio.sva_validation import VerilatorSVAValidator, ValidationStatus
          result = VerilatorSVAValidator().validate(
              "assert property (@(posedge clk) reset |-> !grant);"
          )
          print(result)
          if result.status is not ValidationStatus.VALID:
              raise SystemExit(1)
          PY

  rtl-behavioral-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and Icarus Verilog
        run: |
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Prove seeded RTL mutation is detected
        run: assurance-demo rtl-benchmark --rtl-root benchmarks/rtl
      - name: Exercise V7 four-condition comparison
        run: assurance-demo controlled-eval --rtl-root benchmarks/rtl
      - name: Exercise V8 multi-family repeated corpus
        run: assurance-demo corpus-eval --rtl-root benchmarks/rtl --trials 2
      - name: Exercise V9 experiment artifact bundle
        run: |
          assurance-demo corpus-eval --rtl-root benchmarks/rtl --trials 1 --output-root /tmp/assurance-experiments
          test -f /tmp/assurance-experiments/*/manifest.json
          test -f /tmp/assurance-experiments/*/results.csv
          test -f /tmp/assurance-experiments/*/aggregates.csv
          test -f /tmp/assurance-experiments/*/REPORT.md
