name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI
        run: |
          assurance-demo cloudguard examples/cloudguard_incident.json
          assurance-demo trace examples/agent_trace.json
          assurance-demo copilot examples/requirements.json
          assurance-demo benchmark
      - name: Exercise CloudGuard V4 assurance controls
        run: |
          rm -f /tmp/cloudguard-audit.jsonl
          assurance-cloudguard --audit-log /tmp/cloudguard-audit.jsonl threat-update examples/cloudguard_v4_threat_update.json
          assurance-cloudguard --audit-log /tmp/cloudguard-audit.jsonl record-detection examples/cloudguard_v4_detection.json \
            --threat-db-digest 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          assurance-cloudguard --audit-log /tmp/cloudguard-audit.jsonl response examples/cloudguard_v4_response.json
          assurance-cloudguard --audit-log /tmp/cloudguard-audit.jsonl feedback examples/cloudguard_v4_field_issue.json
          assurance-cloudguard --audit-log /tmp/cloudguard-audit.jsonl record-outcome examples/cloudguard_v4_outcome.json
          assurance-cloudguard --audit-log /tmp/cloudguard-audit.jsonl verify-audit
          test "$(wc -l < /tmp/cloudguard-audit.jsonl)" -eq 6
      - name: Exercise CloudGuard V5 predictive controls
        run: |
          assurance-cloudguard-predict profile examples/cloudguard_v5_profile.json > /tmp/cloudguard-v5-profile.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/cloudguard-v5-profile.json').read_text())
          assert payload['state']['primary_technique'] == 'T-DISC'
          assert payload['next_techniques']
          assert payload['attack_paths']
          assert payload['state']['assurance'] in {'HIGH', 'PARTIAL'}
          PY
      - name: Exercise Agent Trace Assurance V6 controls
        run: |
          assurance-runtime examples/runtime_assurance_request.json
          assurance-integrity evaluation examples/evaluation_integrity_clean.json
          assurance-integrity cicd examples/cicd_integrity_clean.json
          assurance-integrity attribution --baseline 0.50 --full 0.85 --isolated 0.55
          assurance-trace-audit --audit-log /tmp/trace-audit.jsonl check-update examples/check_update.json
          assurance-trace-audit --audit-log /tmp/trace-audit.jsonl evaluate examples/agent_trace.json \
            --check-version agent-trace-checks/6.1.0 \
            --minimum-check-version agent-trace-checks/6.0.0 \
            --check-manifest-file checks/agent-trace-checks/6.1.0.json \
            --schema-version agent-trace/2.0.0 \
            --schema-file schemas/agent-trace/2.0.0.json \
            --policy-version agent-trace-policy/2.0.0 \
            --policy-file policies/agent-trace-policy/2.0.0.json
          assurance-trace-audit --audit-log /tmp/trace-audit.jsonl anchor --external-reference ci-local-anchor
          assurance-trace-audit --audit-log /tmp/trace-audit.jsonl verify
          assurance-trace-audit self-test
          assurance-trace-audit --audit-log /tmp/trace-audit.jsonl field-issue examples/field_issue.json
          test "$(wc -l < /tmp/trace-audit.jsonl)" -eq 4
