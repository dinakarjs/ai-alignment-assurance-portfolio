name: Verification Intelligence producer contract

on:
  pull_request:
    paths:
      - 'src/assurance_portfolio/consumer_profile.py'
      - 'src/assurance_portfolio/trace_audit*.py'
      - 'src/assurance_portfolio/result_integrity.py'
      - 'tests/test_consumer_profile.py'
      - 'tests/integration/test_vi_consumer.py'
      - '.github/workflows/vi-consumer-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer-consumer-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      VI_CONSUMER_ROOT: ${{ github.workspace }}/.vi-consumer
      VI_CONTRACT_EVIDENCE: build/producer-consumer-contract
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: dinakarjs/verification-intelligence
          ref: ddfa7893b6b2edca97807ba00f24ebef3ddf644a
          path: .vi-consumer
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -e .vi-consumer
      - name: Actual CLI capture, consumption and adversarial checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/producer-consumer-contract
          python - <<'PY' 2>&1 | tee build/producer-consumer-contract/tests.txt
          import json
          from pathlib import Path
          import unittest
          suite = unittest.defaultTestLoader.discover('tests/integration', pattern='test_vi_consumer.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          passed = result.wasSuccessful() and result.testsRun == 6 and not result.skipped
          Path('build/producer-consumer-contract/test-summary.json').write_text(json.dumps({
              'tests_run': result.testsRun, 'failures': len(result.failures), 'errors': len(result.errors),
              'skipped': len(result.skipped), 'contract_tests_passed': passed,
              'production_qualified': False, 'model_api_calls': 0}, indent=2))
          raise SystemExit(0 if passed else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TEST-ONLY-producer-consumer-${{ github.sha }}
          path: build/producer-consumer-contract
          if-no-files-found: error
          retention-days: 30
