[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-alignment-assurance-portfolio"
version = "0.14.0"
description = "Runnable prototypes for verification-driven AI assurance and agentic pre-silicon verification"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42.0.0",
  "jsonschema>=4.23.0"
]

[project.optional-dependencies]
agentic = ["openai>=1.66.0"]

[project.scripts]
assurance-demo = "assurance_portfolio.cli:main"
assurance-trace-audit = "assurance_portfolio.trace_audit_cli:main"
assurance-runtime = "assurance_portfolio.runtime_cli:main"
assurance-integrity = "assurance_portfolio.integrity_cli:main"
assurance-cloudguard = "assurance_portfolio.cloudguard_v4_cli:main"
assurance-cloudguard-predict = "assurance_portfolio.cloudguard_v5_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
